<!DOCTYPE html>
<html>
<head>
<title>DGV Seafoods Grill and Restaurant in Dalaguete Cebu</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap');

    body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: url('12.jpg') no-repeat center center fixed;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #333;
    }

    .contact-card {
        background: rgba(255,255,255,0.95);
        padding: 40px 60px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        text-align: center;
        max-width: 600px;
    }

    .contact-card h1 {
        font-family: "Playfair Display", serif;
        color: #003A70; /* Deep Blue */
        margin-bottom: 20px;
        font-size: 32px;
        text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
    }

    .contact-info {
        margin-top: 20px;
        font-size: 18px;
        line-height: 1.8;
        color: #222;
    }

    .contact-info span {
        display: block;
        color: #003A70; /* Deep Blue */
        font-weight: 600;
        margin-top: 8px;
        font-size: 20px;
    }

    .nav-bar {
        margin-bottom: 30px;
    }

    .nav-bar a {
        color: #003A70; /* Deep Blue */
        text-decoration: none;
        margin: 0 12px;
        font-weight: 600;
        font-size: 16px;
    }

    .nav-bar a:hover {
        color: #FF7F50;
        transition: 0.3s;
    }

    @media(max-width: 650px) {
        .contact-card {
            padding: 30px 20px;
        }

        .contact-card h1 {
            font-size: 26px;
        }

        .contact-info {
            font-size: 16px;
        }

        .contact-info span {
            font-size: 18px;
        }
    }
</style>
</head>
<body>
    <div class="contact-card">
        <div class="nav-bar">
            <a href=index.html>HOME</a>||
            <a href=events.html>EVENTS</a>||
            <a href=contacts.html>CONTACT US</a>||
            <a href=products.html>PRODUCTS</a>
        </div>
        <h1>DGV SEAFOODS GRILL AND RESTAURANTS</h1>
        <div class="contact-info">
            Permanent Address:
            <span>SAN GUILLERMO ST. POBLACION, DALAGUETE, CEBU</span>
            Mobile Number:
            <span>09085149405 or 09759558436</span>
            Facebook Page:
            <span>DGV Seafoods Grill and Restaurant</span>
        </div>
    </div>
</body>
</html>
